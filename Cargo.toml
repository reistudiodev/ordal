[workspace]
resolver = "2"
members = ["core", "uniffi-bindgen"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "SEE LICENSE IN LICENSE.md"

[workspace.dependencies]
uniffi = "0.32"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-util = "0.7"
async-trait = "0.1"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
percent-encoding = "2"
directories = "6"
rust_decimal = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "chrono", "uuid", "rust_decimal", "json"] }
mongodb = "3"
redis = { version = "0.32", default-features = false, features = ["tokio-rustls-comp", "acl", "streams", "keep-alive", "num-bigint"] }
keyring = "3"
tempfile = "3"

# No `strip = true` here: it removes the metadata uniffi-bindgen reads from the library.
[profile.release]
lto = true
codegen-units = 1
