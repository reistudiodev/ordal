# Throwaway database servers for the core's integration tests.
#   scripts/test-integration.sh   # starts these, runs cargo test, stops them
# Ports are offset from the defaults so they never clash with local servers.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: ordal
    ports: ["55432:5432"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      retries: 30
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ordal
      MYSQL_DATABASE: ordal
    ports: ["53306:3306"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-pordal"]
      interval: 2s
      retries: 60
  mariadb:
    image: mariadb:10.11
    environment:
      MARIADB_ROOT_PASSWORD: ordal
      MARIADB_DATABASE: ordal
    ports: ["53307:3306"]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      retries: 60
  mongodb:
    image: mongo:7
    ports: ["57017:27017"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ping: 1})"]
      interval: 2s
      retries: 30
  redis:
    image: redis:7
    ports: ["56379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 30
