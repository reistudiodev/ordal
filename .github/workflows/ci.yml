name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      platform:
        description: "Select platform to test"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - macos
          - linux
          - windows

jobs:
  macos:
    name: macOS (Tests & App Build)
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'macos' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust tests
        run: cargo test
      - name: Build core and bindings
        run: ./scripts/build-core.sh
      - name: Swift tests
        run: swift test
        working-directory: swift
      - name: Build macOS app
        run: swift build
        working-directory: apps/macos

  linux:
    name: Linux (Tests & App Build)
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'linux' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux dependencies (keyring, GTK 4 / GTK 3)
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config libgtk-4-dev libgtk-3-dev clang
      # Server engines are skipped here (no ORDAL_TEST_*_URL); SQLite always runs.
      - name: Rust tests
        run: cargo test
      - name: Build core and bindings
        run: ./scripts/build-core.sh
      - name: Swift tests
        run: swift test
        working-directory: swift
      - name: Build Linux app (GTK 4)
        run: swift build
        working-directory: apps/linux

  # Every driver against real servers. Linux runners are the only ones with Docker.
  integration:
    name: Database Integration Tests (Linux Docker)
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'linux' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ordal
        ports: ["55432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 2s --health-retries 30
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ordal
          MYSQL_DATABASE: ordal
        ports: ["53306:3306"]
        options: --health-cmd "mysqladmin ping -h 127.0.0.1 -pordal" --health-interval 2s --health-retries 60
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: ordal
          MARIADB_DATABASE: ordal
        ports: ["53307:3306"]
        options: --health-cmd "healthcheck.sh --connect --innodb_initialized" --health-interval 2s --health-retries 60
      mongodb:
        image: mongo:7
        ports: ["57017:27017"]
        options: --health-cmd "mongosh --quiet --eval 'db.runCommand({ping: 1})'" --health-interval 2s --health-retries 30
      redis:
        image: redis:7
        ports: ["56379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 2s --health-retries 30
    env:
      ORDAL_TEST_POSTGRES_URL: postgres://postgres:ordal@127.0.0.1:55432/postgres
      ORDAL_TEST_MYSQL_URL: mysql://root:ordal@127.0.0.1:53306/ordal
      ORDAL_TEST_MARIADB_URL: mariadb://root:ordal@127.0.0.1:53307/ordal
      ORDAL_TEST_MONGODB_URL: mongodb://127.0.0.1:57017/ordal
      ORDAL_TEST_REDIS_URL: redis://127.0.0.1:56379/15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - run: cargo test -p ordal-core

  # Swift on Windows isn't preinstalled on runners; this checks the Rust side for now.
  windows-core:
    name: Windows (Core Tests)
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'windows' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test
