[package]
name = "dbclient-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Platform-independent logic for the database client (the \"brain\")."

[lib]
# lib: used by Rust tests and the bindgen
# staticlib: linked into the Swift apps on every platform
# cdylib: needed by uniffi-bindgen to read the interface metadata
crate-type = ["lib", "staticlib", "cdylib"]
name = "dbclient_core"

[features]
# One feature per database engine. All on by default.
default = ["postgres", "mysql", "sqlite", "mongodb", "redis"]
postgres = ["dep:sqlx", "sqlx/postgres"]
mysql = ["dep:sqlx", "sqlx/mysql"]
sqlite = ["dep:sqlx", "sqlx/sqlite"]
mongodb = ["dep:mongodb"]
redis = ["dep:redis"]

[dependencies]
uniffi.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
async-trait.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
percent-encoding.workspace = true
directories.workspace = true
rust_decimal.workspace = true
sqlx = { workspace = true, optional = true }
mongodb = { workspace = true, optional = true }
redis = { workspace = true, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { workspace = true, features = ["apple-native"] }
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { workspace = true, features = ["windows-native"] }
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { workspace = true, features = ["sync-secret-service", "crypto-rust"] }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
